<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Request Received | Vinals Marine Diesel</title>
  <meta name="robots" content="noindex">
  <style>
    :root {
      --navy: #0b2540;
      --accent: #f2a541;
      --muted: #5a6b7b;
      --bg: #f6f8fa;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--navy);
      text-align: center;
      line-height: 1.6;
    }

    .box {
      background: #fff;
      border: 1px solid #e1e7ed;
      border-radius: 12px;
      padding: 40px 28px;
      max-width: 520px;
    }

    .check {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: rgba(31, 122, 140, 0.12);
      color: #1f7a8c;
      display: grid;
      place-items: center;
    }

    h1 { margin: 0 0 10px; font-size: 1.6rem; }

    p { color: var(--muted); margin: 0 0 24px; }

    a.btn {
      display: inline-block;
      padding: 12px 22px;
      border-radius: 999px;
      background: var(--accent);
      color: var(--navy);
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="check" aria-hidden="true">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </div>
    <h1>Thanks, we got your request.</h1>
    <p>Vinals Marine Diesel will contact you soon. If it's urgent, call us at <a href="tel:+19545524600">(954) 552-4600</a>.</p>
    <a href="/" class="btn">Back to Home</a>
  </div>
</body>
</html>
